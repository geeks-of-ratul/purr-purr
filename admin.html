<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Birthday Admin</title><style>body{font-family:system-ui,sans-serif;background:#120d18;color:#fff;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(560px,100%);background:#24152a;border:1px solid #ffffff1f;border-radius:24px;padding:24px;box-shadow:0 25px 80px #0007}.row{display:grid;gap:8px;margin:12px 0}label{font-size:.8rem;color:#cbbbc6}input{padding:12px;border-radius:12px;border:1px solid #ffffff22;background:#140f19;color:#fff}button{padding:12px 16px;border:0;border-radius:12px;background:#ef6198;color:#fff;font-weight:800;cursor:pointer}.out{margin-top:14px;white-space:pre-wrap;color:#d9ccd4;font-size:.85rem;line-height:1.6}.hint{font-size:.8rem;color:#aa98a5;line-height:1.5}</style></head><body><section class="card"><h1>🐾 Birthday Admin</h1><p class="hint">Use this only on your owner/admin side. It activates extra devices after the first device is registered.</p><div class="row"><label>Admin key</label><input id="adminKey" type="password"></div><div class="row"><label>Device code</label><input id="deviceId" placeholder="Paste the device code here"></div><div class="row"><button id="activate">Activate device</button></div><div class="row"><button id="list">Show registered + pending devices</button></div><div id="out" class="out"></div></section><script>const out=document.getElementById('out');document.getElementById('activate').onclick=async()=>{out.textContent='Working…';try{const r=await fetch('/api/admin/add-device',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({adminKey:document.getElementById('adminKey').value,deviceId:document.getElementById('deviceId').value.trim()})});out.textContent=await r.text()}catch(e){out.textContent=e.message}};document.getElementById('list').onclick=async()=>{out.textContent='Loading…';try{const k=encodeURIComponent(document.getElementById('adminKey').value);const r=await fetch('/api/admin/list?key='+k);out.textContent=await r.text()}catch(e){out.textContent=e.message}}</script></body></html>
