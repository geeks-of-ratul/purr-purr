<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#140f1c">
<meta name="description" content="A tiny cat-themed birthday page.">
<title>A Tiny Cat Thing 🐾</title>
<style>
:root{--bg:#120d18;--bg2:#24152a;--pink:#ef6199;--pink2:#ffb2ce;--cream:#fffaf5;--ink:#483743;--muted:#796672;--line:rgba(255,255,255,.13);--card:rgba(255,255,255,.08);--shadow:0 30px 90px rgba(0,0,0,.28)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden;background:var(--bg);color:#fff}button,input,textarea{font:inherit}.hidden{display:none!important}
.waiting{min-height:100svh;position:relative;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden;isolation:isolate}.waiting:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.55) 1px,transparent 1px),radial-gradient(rgba(255,255,255,.22) 1px,transparent 1px);background-size:110px 110px,170px 170px;background-position:0 0,35px 65px;opacity:.18;animation:drift 25s linear infinite;z-index:-3}.orb{position:absolute;border-radius:50%;filter:blur(55px);opacity:.18;z-index:-2}.orb.a{width:350px;height:350px;left:-140px;top:-50px;background:#f765a4}.orb.b{width:300px;height:300px;right:-120px;top:22%;background:#8f82ff}.orb.c{width:340px;height:340px;left:34%;bottom:-210px;background:#ffd45e}.shell{width:min(1080px,100%)}.topline{display:flex;align-items:center;justify-content:space-between;gap:14px;color:#cdbec9;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;font-weight:900}.topline .dot{width:7px;height:7px;border-radius:50%;background:#78e0a6;box-shadow:0 0 0 7px rgba(120,224,166,.08)}.hero{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center;margin-top:18px}.copy h1{font-size:clamp(3rem,8vw,6.8rem);line-height:.86;letter-spacing:-.07em;margin:0 0 18px}.copy h1 span{display:block;color:var(--pink2)}.lead{max-width:610px;color:#cbbdc7;font-size:1.05rem;line-height:1.75;margin:0}.count-card{margin-top:25px;padding:18px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.045));border-radius:26px;box-shadow:var(--shadow);backdrop-filter:blur(14px)}.count-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#e9dfe6;font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;font-weight:900}.count{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.unit{padding:16px 8px;border-radius:18px;background:rgba(255,255,255,.065);border:1px solid rgba(255,255,255,.07);text-align:center}.unit strong{display:block;font-size:clamp(1.8rem,5vw,2.8rem);line-height:1}.unit span{display:block;margin-top:7px;color:#ae9ca8;font-size:.66rem;letter-spacing:.11em;text-transform:uppercase;font-weight:900}.clock{margin-top:11px;color:#b9a8b3;font-size:.84rem}.subtle{margin-top:13px;color:#d5c8d0;font-size:.92rem}.subtle b{color:#ffd66f}.cat-stage{display:grid;place-items:center;min-height:520px}.cat-scene{width:min(460px,100%);aspect-ratio:4/5;position:relative;border-radius:38px;background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.045));border:1px solid rgba(255,255,255,.14);box-shadow:0 40px 100px rgba(0,0,0,.35);overflow:hidden;transform:rotate(2deg);animation:float 4.4s ease-in-out infinite}.moon{position:absolute;right:10%;top:9%;width:86px;height:86px;border-radius:50%;background:#fff3bb;box-shadow:0 0 60px rgba(255,233,165,.24)}.window{position:absolute;inset:12%;border:1px dashed rgba(255,255,255,.13);border-radius:28px}.bigcat{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);font-size:clamp(10rem,25vw,15rem);filter:drop-shadow(0 25px 22px rgba(0,0,0,.28));animation:bob 2.5s ease-in-out infinite}.cat-tail{position:absolute;right:19%;bottom:21%;font-size:4.5rem;transform:rotate(-17deg);animation:tail 1.8s ease-in-out infinite}.spark{position:absolute;font-size:1.55rem;animation:twinkle 2.3s ease-in-out infinite}.s1{left:11%;top:15%}.s2{left:20%;bottom:16%;animation-delay:-.9s}.s3{right:11%;top:30%;animation-delay:-1.4s}.s4{right:19%;bottom:13%;animation-delay:-.3s}.paw{position:absolute;font-size:1.8rem;opacity:.55;animation:float 3.2s ease-in-out infinite}.p1{left:3%;top:12%}.p2{right:2%;bottom:30%;animation-delay:-1.1s}.p3{left:6%;bottom:5%;animation-delay:-2s}
.gate{min-height:100svh;display:grid;place-items:center;padding:22px;background:linear-gradient(180deg,#fffaff,#fff2f7);color:var(--ink)}.gate-card{width:min(520px,100%);padding:28px;border-radius:30px;background:#fff;border:1px solid #efd9e5;box-shadow:0 25px 70px rgba(95,41,68,.12);text-align:center}.gate-card .lock{font-size:3.2rem}.gate-card h2{margin:10px 0 8px;font-size:clamp(2rem,7vw,3rem);color:#ac3866}.gate-card p{margin:0;color:var(--muted);line-height:1.7}.key-form{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}.key-form input{flex:1 1 200px;min-width:0;padding:14px 15px;border-radius:16px;border:1px solid #e6cbd9;outline:none;background:#fff8fc;color:var(--ink)}.key-form button{flex:0 0 auto;padding:14px 18px;border:0;border-radius:16px;background:linear-gradient(135deg,#ef6198,#b75bf1);color:#fff;font-weight:900;cursor:pointer}.key-form button:disabled{opacity:.55;cursor:wait}.error{margin-top:10px;color:#b03a5d;font-size:.86rem;min-height:1.3em}.tiny-note{margin-top:14px;color:#9a7a8a;font-size:.75rem}
.birthday{min-height:100svh;background:linear-gradient(180deg,#fffafe,#fff3f7 50%,#fffaf0);color:var(--ink);position:relative;overflow:hidden}.birthday-inner{width:min(1060px,100%);margin:0 auto;padding:26px 18px 46px;position:relative;z-index:2}.badge{display:inline-flex;gap:7px;align-items:center;padding:8px 12px;border-radius:999px;background:#fff;border:1px solid #efd8e4;color:#8b5a73;font-size:.78rem;font-weight:900;box-shadow:0 10px 24px rgba(90,34,65,.06)}.birthday-top{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end}.birthday h2{margin:15px 0 10px;font-size:clamp(3.1rem,8vw,6.6rem);line-height:.84;letter-spacing:-.065em;color:#b93669}.birthday h2 span{display:block;color:#ef6199}.intro{margin:0;max-width:720px;color:#725b67;font-size:1.03rem;line-height:1.72}.surprise-btn{border:0;cursor:pointer;padding:15px 18px;border-radius:17px;background:linear-gradient(135deg,#ef6198,#b75bf1);color:#fff;font-weight:900;box-shadow:0 16px 28px rgba(179,67,128,.22)}.surprise-btn:active{transform:translateY(1px)}.main-card{margin-top:22px;padding:22px;border-radius:26px;background:rgba(255,255,255,.93);border:1px solid #efdce6;box-shadow:0 20px 60px rgba(95,41,68,.08)}.main-card p{margin:0;color:#5e4a56;line-height:1.82}.love-line{margin-top:11px;color:#9a7083;font-size:.86rem}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}.action-card{padding:19px;border-radius:22px;background:#fff;border:1px solid #efdbe6;box-shadow:0 14px 34px rgba(95,41,68,.055)}.action-card h3{margin:0;color:#9f3965;font-size:1.05rem}.action-card p{margin:6px 0 13px;color:#765f6b;font-size:.9rem;line-height:1.55}.meow-btn,.send-btn{border:0;cursor:pointer;padding:11px 14px;border-radius:14px;background:#f7e3ec;color:#8f355e;font-weight:900}.meow-btn:hover,.send-btn:hover{transform:translateY(-1px)}.mood-row{display:flex;gap:8px;flex-wrap:wrap}.mood{border:1px solid #eccedb;background:#fff7fb;color:#8f355e;padding:9px 11px;border-radius:999px;cursor:pointer;font-weight:800}.mood.active{background:#ef6198;color:#fff;border-color:#ef6198}.note-area{width:100%;min-height:94px;resize:vertical;padding:12px;border-radius:14px;border:1px solid #e7cedb;background:#fffafb;color:var(--ink);outline:none}.one-time{margin-top:10px;color:#9b7c8c;font-size:.76rem}.status{margin-top:8px;font-size:.82rem;color:#8b7180;min-height:1.2em}.footer{text-align:center;padding:20px 18px 0;color:#9a7c8c;font-size:.8rem}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}.confetti i{position:absolute;top:-20px;font-style:normal;animation:fall 2.6s ease-in forwards}.destroy{min-height:100svh;display:grid;place-items:center;padding:24px;background:#0e0a10;color:#fff;text-align:center}.destroy-card{width:min(540px,100%);padding:30px 22px;border-radius:30px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);box-shadow:0 30px 90px rgba(0,0,0,.35)}.destroy-card .big{font-size:4rem}.destroy-card h2{margin:10px 0 8px;font-size:2rem}.destroy-card p{margin:0;color:#bcaeb7;line-height:1.7}.fade-in{animation:reveal .65s ease both}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(40px,35px)}}@keyframes float{0%,100%{translate:0 0}50%{translate:0 -9px}}@keyframes bob{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-56%)}}@keyframes tail{0%,100%{transform:rotate(-17deg)}50%{transform:rotate(9deg)}}@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.85) rotate(-5deg)}50%{opacity:1;transform:scale(1.12) rotate(8deg)}}@keyframes rise{0%{transform:translateY(0);opacity:0}12%{opacity:.5}88%{opacity:.5}100%{transform:translateY(-115vh) rotate(210deg);opacity:0}}@keyframes fall{to{transform:translate(calc((var(--x) - .5)*180px),110vh) rotate(520deg);opacity:0}}@keyframes reveal{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
@media(max-width:800px){.hero{grid-template-columns:1fr}.cat-stage{min-height:auto;margin-top:4px}.cat-scene{width:min(380px,92vw)}.birthday-top{grid-template-columns:1fr}.surprise-btn{width:100%}.actions{grid-template-columns:1fr}.birthday-inner{padding-bottom:30px}.topline{font-size:.7rem}.copy h1{font-size:clamp(3rem,16vw,5.2rem)}}
@media(max-width:430px){.waiting{padding:14px}.count-card{padding:14px}.count{gap:7px}.unit{padding:13px 5px}.unit strong{font-size:1.7rem}.birthday-inner{padding:18px 13px 28px}.main-card{padding:18px}.gate-card{padding:22px}.key-form button{width:100%}}
</style>
</head>
<body>
<div id="app"></div><div id="confetti" class="confetti" aria-hidden="true"></div>
<script>
(()=>{
  /* ================= OWNER SETTINGS =================
     Change only these values for the real deployment. */
  const OPEN_HOUR=14;
  const OPEN_MINUTE=20;   // TEST: 14:20 IST
  const DESTROY_HOUR=14;
  const DESTROY_MINUTE=30;// TEST: 14:30 IST
  const OPEN_LABEL='2:20 PM IST';
  const DESTROY_LABEL='2:30 PM IST';
  const MUSIC_URL='assets/meow-birthday.wav';
  const STORAGE_KEY='cat-birthday-device-id-v1';
  const ACCESS_KEY_STATUS_KEY='cat-birthday-access-v1';
  const PREVIEW=new URLSearchParams(location.search).get('preview')==='1';

  const app=document.getElementById('app');
  const confetti=document.getElementById('confetti');

  function deviceId(){
    let id=localStorage.getItem(STORAGE_KEY);
    if(!id){id=(crypto.randomUUID?crypto.randomUUID():('d-'+Date.now()+'-'+Math.random().toString(16).slice(2)));localStorage.setItem(STORAGE_KEY,id)}
    return id;
  }
  const DEVICE_ID=deviceId();

  function istParts(date=new Date()){
    const d=new Date(date.getTime()+330*60*1000);
    return {y:d.getUTCFullYear(),m:d.getUTCMonth()+1,d:d.getUTCDate(),h:d.getUTCHours(),min:d.getUTCMinutes(),s:d.getUTCSeconds(),ms:d.getUTCMilliseconds()};
  }
  function utcMsForIst(y,m,d,h,min){return Date.UTC(y,m-1,d,h,min,0,0)-330*60*1000}
  function eventMs(h,min){const p=istParts();return utcMsForIst(p.y,p.m,p.d,h,min)}
  function istClock(){return new Intl.DateTimeFormat('en-IN',{timeZone:'Asia/Kolkata',hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true}).format(new Date())}
  function state(){const n=Date.now(),o=eventMs(OPEN_HOUR,OPEN_MINUTE),x=eventMs(DESTROY_HOUR,DESTROY_MINUTE);if(n<o)return ['waiting',o,x];if(n<x)return ['birthday',o,x];return ['destroyed',o,x]}

  function destroyed(){try{localStorage.setItem('cat-birthday-destroyed','1')}catch{};if(window.__music){try{window.__music.pause()}catch{}};app.innerHTML='<main class="destroy"><section class="destroy-card"><div class="big">🐾</div><h2>The little cat operation is complete.</h2><p>This page has reached its closing time and is locked on this browser.</p></section></main>';document.title='Mission complete 🐾';}

  function waiting(){
    app.innerHTML=`<main class="waiting"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div><section class="shell"><div class="topline"><span><i class="dot"></i> tiny cat operation</span><span id="clockTop">IST syncing…</span></div><div class="hero"><div class="copy"><h1>Something small.<span>Something fun.</span></h1><p class="lead">A tiny handmade page is scheduled to do its thing at <strong>${OPEN_LABEL}</strong>. Until then, the cats are keeping watch.</p><div class="count-card"><div class="count-head"><span>Countdown</span><span>${OPEN_LABEL}</span></div><div class="count"><div class="unit"><strong id="hh">--</strong><span>Hours</span></div><div class="unit"><strong id="mm">--</strong><span>Minutes</span></div><div class="unit"><strong id="ss">--</strong><span>Seconds</span></div></div><div class="clock" id="clock">IST clock syncing…</div></div><p class="subtle">The cats say: <b>just a tiny bit longer.</b> 🐱</p></div><div class="cat-stage"><div class="cat-scene"><div class="moon"></div><div class="window"></div><div class="paw p1">🐾</div><div class="paw p2">🐾</div><div class="paw p3">🐾</div><div class="bigcat">🐈</div><div class="cat-tail">〰️</div><div class="spark s1">✨</div><div class="spark s2">💫</div><div class="spark s3">⭐</div><div class="spark s4">🐾</div></div></div></div></section></main>`;
    tick();window.__timer=setInterval(tick,250)
  }
  function tick(){
    const [s,o,x]=state();const h=document.getElementById('hh');if(!h)return;
    const c=document.getElementById('clock');const ct=document.getElementById('clockTop');if(c)c.textContent='IST now: '+istClock();if(ct)ct.textContent=istClock();
    if(s==='birthday'){clearInterval(window.__timer); gate(x);return} if(s==='destroyed'){clearInterval(window.__timer);destroyed();return}
    const diff=Math.max(0,o-Date.now());h.textContent=String(Math.floor(diff/3600000)).padStart(2,'0');document.getElementById('mm').textContent=String(Math.floor(diff%3600000/60000)).padStart(2,'0');document.getElementById('ss').textContent=String(Math.floor(diff%60000/1000)).padStart(2,'0')
  }

  function gate(destroyMs){
    if(PREVIEW){birthday(destroyMs);return}
    app.innerHTML=`<main class="gate"><section class="gate-card fade-in"><div class="lock">🐾</div><h2>One tiny gate.</h2><p>The page is ready. Enter the access key to open it on this device.</p><form class="key-form" id="keyForm"><input id="keyInput" autocomplete="off" placeholder="Access key" aria-label="Access key"><button id="keyBtn" type="submit">Open</button></form><div class="error" id="keyError"></div><div class="tiny-note">This device gets registered the first time access is granted.</div></section></main>`;
    document.getElementById('keyForm').addEventListener('submit',async e=>{e.preventDefault();const key=document.getElementById('keyInput').value.trim();const btn=document.getElementById('keyBtn'),err=document.getElementById('keyError');if(!key){err.textContent='Enter the key first.';return}btn.disabled=true;err.textContent='Checking…';try{const r=await fetch('/api/activate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({deviceId:DEVICE_ID,keyCode:key,userAgent:navigator.userAgent})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.message||'Access was not granted.');localStorage.setItem(ACCESS_KEY_STATUS_KEY,'1');birthday(destroyMs)}catch(e){err.textContent=e.message||'Access check failed.'}finally{btn.disabled=false}})
  }

  function birthday(destroyMs){
    app.innerHTML=`<main class="birthday fade-in"><div class="birthday-inner"><div class="birthday-top"><div><div class="badge">🎂 cat-powered birthday department</div><h2>Happy Birthday<span>Ayesha! 🐾</span></h2><p class="intro">A small handmade corner of the internet with cats, cake energy, and an unnecessarily serious amount of meows. 😄</p></div><button class="surprise-btn" id="surpriseBtn">🎁 Open the little surprise</button></div><section class="main-card"><p>Hey Ayesha!<br><br>Happy Birthday! 🎉 Hope today brings good food, good laughs, and a nice little break from the usual office chaos. The cats have been assigned to birthday duty, and frankly, their management style is questionable. 😼</p><div class="love-line">Made with a little <span aria-label="love">❤️</span> and a lot of cat nonsense.</div></section><section class="actions"><article class="action-card"><h3>🐱 Press the meow button</h3><p>Because apparently one meow is never enough.</p><button class="meow-btn" id="meowBtn">MEOW 😸</button><div class="status" id="meowStatus"></div></article><article class="action-card"><h3>📝 Leave one tiny note</h3><p>One short message. One use on this device.</p><textarea id="note" class="note-area" maxlength="280" placeholder="Write anything…"></textarea><button class="send-btn" id="sendNote" style="margin-top:8px">Seal it 🐾</button><div class="one-time">Saved once; the button locks after submission.</div><div class="status" id="noteStatus"></div></article></section><section class="action-card" style="margin-top:14px"><h3>🎭 Pick today's cat mood</h3><p id="moodText">Choose one. The page will react.</p><div class="mood-row"><button class="mood" data-mood="😸 Chaotic">😸 Chaotic</button><button class="mood" data-mood="😺 Chill">😺 Chill</button><button class="mood" data-mood="😹 Dramatic">😹 Dramatic</button></div></section><footer class="footer">A tiny handmade birthday page. No corporate approvals were requested. 🐾</footer></div></main>`;
    launchConfetti();music(destroyMs);wireBirthday();scheduleDestroy(destroyMs)
  }

  function wireBirthday(){
    document.getElementById('surpriseBtn').addEventListener('click',()=>{const btn=document.getElementById('surpriseBtn');btn.textContent='✨ Surprise opened';btn.disabled=true;btn.style.opacity='.7';const m=document.createElement('div');m.className='main-card fade-in';m.style.marginTop='14px';m.innerHTML='<p>Plot twist: there is no giant dramatic reveal. The surprise is simply this little page, a meow orchestra, and a reminder to have a genuinely good day. 😄</p>';document.querySelector('.birthday-inner').insertBefore(m,document.querySelector('.actions'));});
    const meowBtn=document.getElementById('meowBtn');meowBtn.addEventListener('click',()=>{playShortMeow();document.getElementById('meowStatus').textContent='🐾 Meow delivered.'});
    document.querySelectorAll('.mood').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.mood').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('moodText').textContent='Current cat mode: '+b.dataset.mood+' 🐾'}));
    const note=document.getElementById('note'),send=document.getElementById('sendNote'),status=document.getElementById('noteStatus');if(localStorage.getItem('cat-note-used-'+DEVICE_ID)==='1'){send.disabled=true;note.disabled=true;status.textContent='This device already used its one-time note.'}
    send.addEventListener('click',async()=>{const text=note.value.trim();if(!text){status.textContent='Write a tiny note first.';return}send.disabled=true;status.textContent='Saving…';try{const r=await fetch('/api/note',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({deviceId:DEVICE_ID,text})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.message||'Could not save the note.');localStorage.setItem('cat-note-used-'+DEVICE_ID,'1');note.disabled=true;status.textContent='🐾 Sealed. This device can use the note box only once.'}catch(e){send.disabled=false;status.textContent=e.message||'Could not save the note.'}})
  }

  function music(destroyMs){
    const audio=new Audio(MUSIC_URL);audio.loop=true;audio.preload='auto';audio.volume=.72;window.__music=audio;
    // Try immediately at reveal. Browser autoplay rules may still require interaction.
    audio.play().catch(()=>{const start=()=>audio.play().catch(()=>{});document.addEventListener('pointerdown',start,{once:true,passive:true});document.addEventListener('keydown',start,{once:true});});
  }
  function playShortMeow(){
    try{const C=window.AudioContext||window.webkitAudioContext;const ctx=new C();const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(500,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(980,ctx.currentTime+.11);o.frequency.exponentialRampToValueAtTime(420,ctx.currentTime+.34);g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.16,ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.36);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.38)}catch{}}
  function launchConfetti(){const chars=['✦','★','•','◆','🎀','🐾','✨','💗'];confetti.innerHTML='';for(let i=0;i<80;i++){const e=document.createElement('i');e.textContent=chars[Math.floor(Math.random()*chars.length)];e.style.left=Math.random()*100+'%';e.style.setProperty('--x',Math.random());e.style.animationDuration=(1.5+Math.random()*1.8)+'s';e.style.animationDelay=(Math.random()*.5)+'s';confetti.appendChild(e)}setTimeout(()=>confetti.innerHTML='',4300)}
  function scheduleDestroy(destroyMs){if(PREVIEW)return;const wait=Math.max(0,destroyMs-Date.now());window.__destroyTimer=setTimeout(destroyed,wait);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()>=destroyMs)destroyed()})}

  const [s,o,x]=state();
  if(localStorage.getItem('cat-birthday-destroyed')==='1'&&!PREVIEW){destroyed();return}
  if(PREVIEW){birthday(Date.now()+60*60*1000);return}
  if(s==='waiting')waiting(); else if(s==='birthday')gate(x); else destroyed();
})();
</script>
</body>
</html>
